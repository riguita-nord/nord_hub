name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'src/**'
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - 'install.sh'
      - 'compose.yaml'
      - 'deploy/**'
      - 'docs/**'
      - 'README.md'
      - '.env.example'
      - 'IMPLEMENTATION_STATUS.md'
      - '.github/workflows/backend.yml'
  push:
    branches:
      - 'backend/**'
      - 'frontend/**'
      - 'improvement/**'
    paths:
      - 'backend/**'
      - 'src/**'
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - 'install.sh'
      - 'compose.yaml'
      - 'deploy/**'
      - 'docs/**'
      - 'README.md'
      - '.env.example'
      - 'IMPLEMENTATION_STATUS.md'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend and integration tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript
        run: node --check src/app.js && node --check src/api.js
      - name: Check installer and operations scripts
        run: bash -n install.sh scripts/*.sh && ./tests/installer/smoke.sh
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config -q
