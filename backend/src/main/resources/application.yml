server:
  port: ${NORD_HUB_PORT:8081}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: nord-hub
  datasource:
    url: ${NORD_HUB_DB_URL:jdbc:postgresql://localhost:5432/nord_hub}
    username: ${NORD_HUB_DB_USER:nord_hub}
    password: ${NORD_HUB_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${NORD_HUB_DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: Nord Hub
    version: 0.2.0
nordhub:
  security:
    jwt-secret: ${NORD_HUB_JWT_SECRET:}
    token-ttl: ${NORD_HUB_TOKEN_TTL:PT30M}
    admin-emails: ${NORD_HUB_ADMIN_EMAILS:}
    setup-token: ${NORD_HUB_SETUP_TOKEN:}
  cors:
    allowed-origins: ${NORD_HUB_CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  gateway:
    requests-per-minute: ${NORD_HUB_REQUESTS_PER_MINUTE:120}
    auth-requests-per-minute: ${NORD_HUB_AUTH_REQUESTS_PER_MINUTE:10}
  github:
    token: ${NORD_HUB_GITHUB_TOKEN:}
    api-url: ${NORD_HUB_GITHUB_API_URL:https://api.github.com}
    webhook-secret: ${NORD_HUB_GITHUB_WEBHOOK_SECRET:}
  ai:
    api-key: ${NORD_HUB_AI_API_KEY:}
    base-url: ${NORD_HUB_AI_BASE_URL:https://api.openai.com/v1}
    model: ${NORD_HUB_AI_MODEL:gpt-4o-mini}
